[project]
name = "fsboard-alignment"
description = "Character-level forced alignment of FSboard, and the clips whose labels do not match the signing."
version = "1.0.1"
authors = [
    { name = "Amit Moryossef", email = "amit@rylo.com" },
]
license = { text = "CC-BY-4.0" }
readme = "README.md"
requires-python = ">=3.12" # av 19 dropped 3.11
dependencies = [
    "av>=19",
    "numpy",
    "pillow>=10.1", # ImageFont.load_default(size)
    "simple-video-utils>=0.10.1", # read_frames_batched(fps=, size=)
    "torch",
]

[tool.setuptools]
packages = [
    "fsboard_alignment",
]

[tool.ruff]
line-length = 120
extend-exclude = ["fsboard_alignment/mictresnet.py"] # copied from MiCT-RANet, kept as it is

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "N", # pep8-naming
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "PT", # flake8-pytest-style
]

[tool.pytest.ini_options]
addopts = "-v"
pythonpath = ["."]
testpaths = [
    "tests",
]
